<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中鋼構油漆庫存表</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 10px; background-color: #f4f6f8; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #003366; color: white; padding: 12px 16px; border-radius: 8px; }
        .header h1 { margin: 0; font-size: 18px; }
        .menu-btn { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 20px; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; }
        
        .alert-banner { background-color: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; padding: 10px 12px; border-radius: 8px; margin: 10px 0; display: none; font-size: 13px; }
        .alert-banner h4 { margin: 0 0 4px 0; font-size: 14px; }
        .alert-banner ul { margin: 0; padding-left: 18px; line-height: 1.5; }

        /* 精簡條列式容器 */
        .list-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .list-item { background: white; border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border-left: 4px solid #00509e; }
        .list-item.alert-item { border-left-color: #ff4d4f; background-color: #fffbfb; }
        
        .item-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .item-title { font-size: 15px; font-weight: bold; color: #111; }
        .item-brand { font-size: 11px; background: #e6f7ff; color: #1890ff; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
        
        .item-data-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #666; background: #fafafa; padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; }
        .data-tag { font-weight: bold; }
        .data-tag.stock { font-size: 14px; }

        .item-actions { display: flex; justify-content: space-between; align-items: center; }
        .item-date { font-size: 11px; color: #999; }
        .btn-group { display: flex; gap: 6px; }

        .desktop-table { display: none; width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-top: 10px; font-size: 13px; }
        .desktop-table th, .desktop-table td { border: 1px solid #f0f0f0; padding: 10px; text-align: center; }
        .desktop-table th { background-color: #003366; color: white; }

        .badge { padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; display: inline-block; }
        .badge-success { background-color: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .badge-danger { background-color: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }

        .btn { border: none; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 12px; padding: 4px 10px; }
        .btn-check { background-color: #52c41a; color: white; }
        .btn-edit { background-color: #faad14; color: white; }
        .btn-delete { background-color: #ff4d4f; color: white; }
        .btn-submit { background-color: #003366; color: white; width: 100%; padding: 10px; font-size: 14px; margin-top: 10px; }

        .select-group { display: flex; gap: 6px; }
        .select-group select { flex: 1; padding: 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; background: white; }
        .btn-add-opt { background: #1890ff; color: white; border: none; padding: 0 10px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn-manage-opt { background: #f0f0f0; color: #555; border: 1px solid #d9d9d9; padding: 0 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal { background: white; padding: 16px; border-radius: 12px 12px 0 0; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 12px; }
        .modal-header h3 { margin: 0; color: #003366; font-size: 16px; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }

        .form-group { margin-bottom: 10px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; color: #444; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; }

        .loading-mask { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.85); display:flex; justify-content:center; align-items:center; font-weight:bold; color:#003366; z-index:2000; }

        @media (min-width: 768px) {
            body { padding: 20px; max-width: 1000px; margin: 0 auto; }
            .list-container { display: none; }
            .desktop-table { display: table; }
            .modal-overlay { align-items: center; }
            .modal { border-radius: 10px; }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-mask">☁️ 雲端庫存資料同步中...</div>

    <div class="header">
        <h1>中鋼構油漆庫存表</h1>
        <button class="menu-btn" onclick="openInboundModal()">☰</button>
    </div>

    <div class="alert-banner" id="alertBanner">
        <h4>🚨 庫存偏低警告</h4>
        <ul id="alertList"></ul>
    </div>

    <div id="contentArea"></div>

    <!-- 進貨 Modal -->
    <div class="modal-overlay" id="inboundModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📦 油漆進貨登記</h3>
                <button class="close-btn" onclick="closeModal('inboundModal')">✕</button>
            </div>
            <form id="inboundForm">
                <div class="form-group">
                    <label>品牌</label>
                    <div class="select-group">
                        <select id="paintBrandSelect" onchange="onBrandChange()" required>
                            <option value="">-- 請選擇品牌 --</option>
                        </select>
                        <button type="button" class="btn-add-opt" onclick="addBrand()">＋</button>
                        <button type="button" class="btn-manage-opt" onclick="manageBrands()">⚙️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>油漆品項/型號</label>
                    <div class="select-group">
                        <select id="paintNameSelect" required>
                            <option value="">-- 請先選擇品牌 --</option>
                        </select>
                        <button type="button" class="btn-add-opt" onclick="addModel()">＋</button>
                        <button type="button" class="btn-manage-opt" onclick="manageModels()">⚙️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>進貨日期</label>
                    <input type="date" id="inDate" required>
                </div>
                <div class="form-group">
                    <label>進貨數量 (桶/罐)</label>
                    <input type="number" id="inQty" min="1" required>
                </div>
                <div class="form-group">
                    <label>安全庫存警戒值</label>
                    <input type="number" id="minQty" min="0" value="10" required>
                </div>
                <button type="submit" class="btn btn-submit">確認進貨並更新庫存</button>
            </form>
        </div>
    </div>

    <!-- 修改 Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3>✏️ 修改油漆資料</h3>
                <button class="close-btn" onclick="closeModal('editModal')">✕</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editIndex">
                <div class="form-group"><label>品牌</label><input type="text" id="editCategory" required></div>
                <div class="form-group"><label>油漆品項/型號</label><input type="text" id="editName" required></div>
                <div class="form-group"><label>最新進貨日期</label><input type="date" id="editInDate" required></div>
                <div class="form-group"><label>進貨總量 (A)</label><input type="number" id="editTotalIn" min="0" required></div>
                <div class="form-group"><label>現場實點剩餘 (B)</label><input type="number" id="editCurrentStock" min="0" required></div>
                <div class="form-group"><label>安全庫存警戒值</label><input type="number" id="editMinStock" min="0" required></div>
                <button type="submit" class="btn btn-submit" style="background-color: #faad14;">儲存修改內容</button>
            </form>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/a/macros/berlin.com.tw/s/AKfycby3OvhnMaeEQX1uHcogW99zIOA9YCWWhdUDEsPi6dDc-lBPa0xNpSxIc92doeHgS86GmA/exec";

        let inventory = [];
        let brands = JSON.parse(localStorage.getItem('cscPaintBrands')) || ['柏林', '虹牌', '立邦'];
        let models = JSON.parse(localStorage.getItem('cscPaintModels')) || { '柏林': ['棕A', '深灰'], '虹牌': ['永保新防銹漆'], '立邦': ['白乳膠漆'] };

        document.getElementById('inDate').valueAsDate = new Date();

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // 修正時區偏差的日期處理函式
        function formatDate(dateStr) {
            if (!dateStr) return '';
            if (dateStr instanceof Date) {
                const y = dateStr.getFullYear();
                const m = String(dateStr.getMonth() + 1).padStart(2, '0');
                const d = String(dateStr.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            if (typeof dateStr === 'string' && dateStr.includes('T')) {
                const d = new Date(dateStr);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            return String(dateStr).split('T')[0];
        }

        function loadFromCloud() {
            showLoading(true);
            const script = document.createElement('script');
            const callbackName = 'handleCloudData';
            
            window[callbackName] = function(data) {
                inventory = data.map(item => ({
                    id: String(item.id),
                    category: item.category,
                    name: item.name,
                    lastInDate: formatDate(item.lastInDate),
                    totalIn: parseInt(item.totalIn) || 0,
                    currentStock: parseInt(item.currentStock) || 0,
                    minStock: parseInt(item.minStock) || 10
                }));
                render();
                showLoading(false);
                document.body.removeChild(script);
            };

            script.src = `${GOOGLE_SCRIPT_URL}?callback=${callbackName}&t=${Date.now()}`;
            script.onerror = function() {
                alert('雲端連線失敗，請檢查網路或權限');
                showLoading(false);
            };
            document.body.appendChild(script);
        }

        function syncToCloud() {
            showLoading(true);
            const script = document.createElement('script');
            const callbackName = 'handleSyncResult';
            
            window[callbackName] = function(res) {
                showLoading(false);
                document.body.removeChild(script);
                loadFromCloud();
            };

            const jsonStr = encodeURIComponent(JSON.stringify(inventory));
            script.src = `${GOOGLE_SCRIPT_URL}?action=sync&data=${jsonStr}&callback=${callbackName}&t=${Date.now()}`;
            script.onerror = function() {
                alert('更新至雲端失敗！');
                showLoading(false);
            };
            document.body.appendChild(script);
        }

        function saveConfig() {
            localStorage.setItem('cscPaintBrands', JSON.stringify(brands));
            localStorage.setItem('cscPaintModels', JSON.stringify(models));
            renderBrandOptions();
        }

        function openInboundModal() { renderBrandOptions(); document.getElementById('inboundModal').style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        // 動態渲染所有發生的品牌
        function renderBrandOptions() {
            const bSelect = document.getElementById('paintBrandSelect');
            bSelect.innerHTML = '<option value="">-- 請選擇品牌 --</option>';
            let allBrands = new Set([...brands, ...inventory.map(i => i.category)]);
            allBrands.forEach(b => {
                if (b) bSelect.innerHTML += `<option value="${b}">${b}</option>`;
            });
            onBrandChange();
        }

        // 動態根據雲端資料抓取最新型號
        function onBrandChange() {
            const bVal = document.getElementById('paintBrandSelect').value;
            const mSelect = document.getElementById('paintNameSelect');
            mSelect.innerHTML = '';
            
            if (!bVal) {
                mSelect.innerHTML = '<option value="">-- 請先選擇品牌 --</option>';
                return;
            }

            let availableModels = new Set(models[bVal] || []);
            inventory.filter(item => item.category === bVal).forEach(item => {
                if (item.name) availableModels.add(item.name);
            });

            if (availableModels.size === 0) {
                mSelect.innerHTML = '<option value="">-- 請先選擇或新增品項 --</option>';
                return;
            }

            mSelect.innerHTML = '<option value="">-- 請選擇品項 --</option>';
            availableModels.forEach(m => {
                mSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
        }

        function addBrand() {
            const newB = prompt('請輸入新品牌名稱：');
            if (newB && newB.trim()) {
                const name = newB.trim();
                if (!brands.includes(name)) {
                    brands.push(name);
                    models[name] = models[name] || [];
                    saveConfig();
                    document.getElementById('paintBrandSelect').value = name;
                    onBrandChange();
                }
            }
        }

        function manageBrands() {
            const target = prompt(`目前品牌：\n${brands.join('、')}\n\n請輸入要刪除的品牌名稱：`);
            if (!target) return;
            const idx = brands.indexOf(target.trim());
            if (idx !== -1 && confirm(`確定要刪除品牌「${brands[idx]}」嗎？`)) {
                delete models[brands[idx]];
                brands.splice(idx, 1);
                saveConfig();
            }
        }

        function addModel() {
            const bVal = document.getElementById('paintBrandSelect').value;
            if (!bVal) return alert('請先選擇品牌！');
            const newM = prompt(`請輸入【${bVal}】的新品項名稱：`);
            if (newM && newM.trim()) {
                models[bVal] = models[bVal] || [];
                if (!models[bVal].includes(newM.trim())) {
                    models[bVal].push(newM.trim());
                    saveConfig();
                    document.getElementById('paintBrandSelect').value = bVal;
                    onBrandChange();
                    document.getElementById('paintNameSelect').value = newM.trim();
                }
            }
        }

        function manageModels() {
            const bVal = document.getElementById('paintBrandSelect').value;
            if (!bVal) return alert('請先選擇品牌！');
            
            let availableModels = Array.from(new Set([
                ...(models[bVal] || []),
                ...inventory.filter(i => i.category === bVal).map(i => i.name)
            ]));

            if (availableModels.length === 0) return alert('目前沒有可管理的型號');

            const target = prompt(`【${bVal}】目前型號：\n${availableModels.join('、')}\n\n請輸入要刪除的型號名稱：`);
            if (!target) return;
            
            const cleanTarget = target.trim();
            if (models[bVal]) {
                models[bVal] = models[bVal].filter(m => m !== cleanTarget);
            }
            
            saveConfig();
            onBrandChange();
            alert(`已移除型號「${cleanTarget}」選項！`);
        }

        function render() {
            const contentArea = document.getElementById('contentArea');
            const alertBanner = document.getElementById('alertBanner');
            const alertList = document.getElementById('alertList');
            contentArea.innerHTML = ''; alertList.innerHTML = '';
            let lowStockItems = [];

            if (inventory.length === 0) {
                contentArea.innerHTML = `<div style="text-align:center;padding:30px;background:white;border-radius:8px;margin-top:10px;">目前無資料，點擊右上角「<b>☰</b>」新增進貨</div>`;
                alertBanner.style.display = 'none';
                return;
            }

            const listContainer = document.createElement('div'); listContainer.className = 'list-container';
            const table = document.createElement('table'); table.className = 'desktop-table';
            table.innerHTML = `<thead><tr><th>品牌</th><th>油漆品項</th><th>最新進貨日期</th><th>進貨總量 (A)</th><th>現場實點剩餘 (B)</th><th>狀態門檻</th><th>自動計算使用量 (A - B)</th><th>操作</th></tr></thead><tbody id="desktopTbody"></tbody>`;
            const desktopTbody = table.querySelector('#desktopTbody');

            inventory.forEach((item, index) => {
                const threshold = item.minStock !== undefined ? item.minStock : 10;
                const isLow = item.currentStock <= threshold;
                const used = item.totalIn - item.currentStock;

                if (isLow) lowStockItems.push(`【${item.category} - ${item.name}】剩餘 <b>${item.currentStock}</b> (警戒線：${threshold})`);

                const badgeHtml = isLow ? `<span class="badge badge-danger">🔴 偏低 (${item.currentStock}/${threshold})</span>` : `<span class="badge badge-success">🟢 正常</span>`;

                const listItem = document.createElement('div'); listItem.className = `list-item ${isLow ? 'alert-item' : ''}`;
                listItem.innerHTML = `
                    <div class="item-main">
                        <div>
                            <span class="item-title">${item.name}</span>
                            <span class="item-brand">${item.category}</span>
                        </div>
                        <div>${badgeHtml}</div>
                    </div>
                    <div class="item-data-row">
                        <div>剩餘(B): <span class="data-tag stock" style="color:${isLow?'#ff4d4f':'#52c41a'}">${item.currentStock}</span></div>
                        <div>進貨(A): <span class="data-tag">${item.totalIn}</span></div>
                        <div>已用(A-B): <span class="data-tag" style="color:#ff4d4f">${used<0?'異常':used}</span></div>
                    </div>
                    <div class="item-actions">
                        <span class="item-date">進貨日: ${item.lastInDate}</span>
                        <div class="btn-group">
                            <button class="btn btn-check" onclick="updateStock(${index})">清點</button>
                            <button class="btn btn-edit" onclick="openEditModal(${index})">修改</button>
                            <button class="btn btn-delete" onclick="deleteItem(${index})">刪除</button>
                        </div>
                    </div>`;
                listContainer.appendChild(listItem);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.category}</td><td><b>${item.name}</b></td><td>${item.lastInDate}</td><td>${item.totalIn}</td>
                    <td style="color:${isLow?'red':'green'};font-weight:bold;">${item.currentStock}</td><td>${badgeHtml}</td>
                    <td style="color:red;font-weight:bold;">${used<0?'盤點異常':used}</td>
                    <td>
                        <button class="btn btn-check" onclick="updateStock(${index})">清點</button>
                        <button class="btn btn-edit" onclick="openEditModal(${index})">修改</button>
                        <button class="btn btn-delete" onclick="deleteItem(${index})">刪除</button>
                    </td>`;
                desktopTbody.appendChild(tr);
            });

            contentArea.appendChild(listContainer); contentArea.appendChild(table);

            if (lowStockItems.length > 0) {
                alertBanner.style.display = 'block';
                lowStockItems.forEach(msg => { const li = document.createElement('li'); li.innerHTML = msg; alertList.appendChild(li); });
            } else { alertBanner.style.display = 'none'; }
        }

        document.getElementById('inboundForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const category = document.getElementById('paintBrandSelect').value;
            const name = document.getElementById('paintNameSelect').value;
            const dateInput = document.getElementById('inDate').value; 
            const qty = parseInt(document.getElementById('inQty').value);
            const minQty = parseInt(document.getElementById('minQty').value);

            const existing = inventory.find(i => i.name === name && i.category === category);
            if (existing) {
                existing.totalIn += qty; 
                existing.currentStock += qty; 
                existing.lastInDate = dateInput; 
                existing.minStock = minQty;
            } else {
                inventory.push({ 
                    id: Date.now().toString(), 
                    category, 
                    name, 
                    lastInDate: dateInput, 
                    totalIn: qty, 
                    currentStock: qty, 
                    minStock: minQty 
                });
            }
            syncToCloud(); 
            closeModal('inboundModal');
        });

        function openEditModal(index) {
            const item = inventory[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editName').value = item.name;
            document.getElementById('editInDate').value = formatDate(item.lastInDate);
            document.getElementById('editTotalIn').value = item.totalIn;
            document.getElementById('editCurrentStock').value = item.currentStock;
            document.getElementById('editMinStock').value = item.minStock || 10;
            document.getElementById('editModal').style.display = 'flex';
        }

        // 修改表單提交：同步替換舊選單名稱並上傳雲端
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const oldCat = inventory[index].category;
            const oldName = inventory[index].name;

            const newCat = document.getElementById('editCategory').value.trim();
            const newName = document.getElementById('editName').value.trim();

            inventory[index].category = newCat;
            inventory[index].name = newName;
            inventory[index].lastInDate = document.getElementById('editInDate').value;
            inventory[index].totalIn = parseInt(document.getElementById('editTotalIn').value);
            inventory[index].currentStock = parseInt(document.getElementById('editCurrentStock').value);
            inventory[index].minStock = parseInt(document.getElementById('editMinStock').value);

            if (models[oldCat]) {
                models[oldCat] = models[oldCat].filter(m => m !== oldName);
            }
            
            if (!brands.includes(newCat)) brands.push(newCat);
            models[newCat] = models[newCat] || [];
            if (!models[newCat].includes(newName)) models[newCat].push(newName);

            saveConfig();
            syncToCloud(); 
            closeModal('editModal');
        });

        function updateStock(index) {
            const item = inventory[index];
            const current = prompt(`請輸入「${item.category} - ${item.name}」現場實際剩餘數量：`, item.currentStock);
            if (current !== null && !isNaN(parseInt(current))) {
                item.currentStock = parseInt(current);
                syncToCloud();
            }
        }

        function deleteItem(index) {
            if (confirm(`確定要刪除「${inventory[index].name}」嗎？`)) {
                inventory.splice(index, 1);
                syncToCloud();
            }
        }

        loadFromCloud();
    </script>
</body>
</html>
